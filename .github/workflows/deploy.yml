name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: Job 1 - Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run unit tests
        run: npm run test:unit

  e2e-tests:
    name: Job 2 - E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run E2E tests
        run: npm run test:e2e

  build-and-push:
    name: Job 3 - Build & Push Docker Hub
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tp-deploiement:latest,${{ secrets.DOCKER_USERNAME }}/tp-deploiement:${{ github.sha }}

  deploy:
    name: Job 4 - Deploy on Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/tp-deploiement:latest
            
            # Stop and remove existing container if it exists (Idempotency)
            docker stop myapp-container || true
            docker rm myapp-container || true
            
            # Run new container
            docker run -d --name myapp-container -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/tp-deploiement:latest
            
            # Healthcheck
            sleep 5
            curl -f http://localhost:8080/health || exit 1
